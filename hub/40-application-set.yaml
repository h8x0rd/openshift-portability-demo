apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: portability-demo
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: portability-demo-targets
        requeueAfterSeconds: 15
  template:
    metadata:
      name: 'portability-demo-{{ .name }}'
      labels:
        demo.portability/application: portability-demo
        demo.portability/cluster: '{{ .name }}'
    spec:
      project: default
      destination:
        server: '{{ .server }}'
        namespace: portability-demo
      source:
        repoURL: GIT_REPOSITORY_URL
        targetRevision: GIT_TARGET_REVISION
        path: charts/portability-demo
        helm:
          releaseName: portability-demo
          parameters:
            - name: cluster.name
              value: '{{ .name }}'
            - name: cluster.apiServer
              value: '{{ .server }}'
            - name: application.gitRevision
              value: GIT_TARGET_REVISION
            - name: application.gitRepository
              value: GIT_REPOSITORY_URL
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions: [CreateNamespace=true, PruneLast=true, ApplyOutOfSyncOnly=true]
