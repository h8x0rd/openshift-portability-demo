apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: portability-demo-targets
  namespace: openshift-gitops
  labels:
    demo.portability/application: portability-demo
spec:
  numberOfClusters: 2
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: cluster.open-cluster-management.io/clusterset
              operator: In
              values: [demo-clusters]
            - key: demo.portability/role
              operator: In
              values: [primary, secondary]
  prioritizerPolicy:
    mode: Exact
    configurations:
      - scoreCoordinate:
          builtIn: Steady
        weight: 1
