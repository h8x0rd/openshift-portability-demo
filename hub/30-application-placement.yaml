apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: portability-demo-targets
  namespace: openshift-gitops
  labels:
    demo.portability/component: workload-placement
spec:
  numberOfClusters: 1
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: vendor
              operator: In
              values: [OpenShift]
            - key: cloud
              operator: In
              values: [Amazon]
            - key: region
              operator: In
              values: [eu-west-3, eu-west-2]
