apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: portability-demo-registered-clusters
  namespace: openshift-gitops
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: vendor
              operator: In
              values:
                - OpenShift
            - key: cloud
              operator: In
              values:
                - Amazon
            - key: region
              operator: In
              values:
                - eu-west-3
                - eu-west-2
  tolerations:
    - key: cluster.open-cluster-management.io/unreachable
      operator: Exists
    - key: cluster.open-cluster-management.io/unavailable
      operator: Exists
