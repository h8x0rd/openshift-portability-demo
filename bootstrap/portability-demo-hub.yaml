apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portability-demo-hub
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/h8x0rd/openshift-portability-demo.git
    targetRevision: main
    path: hub
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]
