apiVersion: v1
kind: ConfigMap
metadata:
  name: portability-demo-content
  labels:
    {{- include "portability-demo.labels" . | nindent 4 }}
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>{{ .Values.application.name }}</title>
      <style>
        :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
        * { box-sizing: border-box; }
        body {
          margin: 0; min-height: 100vh; color: #f7f7f8;
          background:
            radial-gradient(circle at 15% 15%, rgba(238,0,0,.20), transparent 34rem),
            radial-gradient(circle at 85% 85%, rgba(90,80,230,.22), transparent 34rem),
            #090b10;
          display: grid; place-items: center; padding: 32px;
        }
        .shell { width: min(980px,100%); }
        .eyebrow { letter-spacing: .18em; text-transform: uppercase; color: #ff8080; font-size: .75rem; }
        h1 { margin: .5rem 0; font-size: clamp(2.2rem,7vw,5.8rem); line-height: .95; }
        .lead { color: #b8bdc9; font-size: clamp(1rem,2vw,1.25rem); max-width: 44rem; }
        .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:34px; }
        .card { background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.12);
          border-radius:18px; padding:18px; backdrop-filter:blur(16px); }
        .label { color:#8f96a6; font-size:.75rem; text-transform:uppercase; letter-spacing:.12em; }
        .value { margin-top:8px; font-size:1.1rem; overflow-wrap:anywhere; }
        .status { display:inline-flex; align-items:center; gap:9px; margin-top:28px; padding:10px 14px;
          border:1px solid rgba(124,255,168,.3); border-radius:999px; color:#9affbd;
          background:rgba(43,180,90,.09); }
        .dot { width:9px; height:9px; border-radius:50%; background:#57e389;
          box-shadow:0 0 18px #57e389; animation:pulse 1.7s infinite; }
        footer { margin-top:28px; color:#727989; font-size:.85rem; display:flex; justify-content:space-between; gap:20px; }
        @keyframes pulse { 50% { opacity:.35; transform:scale(.82); } }
        @media(max-width:760px){ .grid{grid-template-columns:1fr 1fr} footer{flex-direction:column} }
        @media(max-width:440px){ .grid{grid-template-columns:1fr} body{padding:20px} }
      </style>
    </head>
    <body>
      <main class="shell">
        <div class="eyebrow">Red Hat Advanced Cluster Management + OpenShift GitOps</div>
        <h1>Application<br>Portability</h1>
        <p class="lead">{{ .Values.application.message }}</p>
        <div class="status"><span class="dot"></span> Healthy and GitOps managed</div>
        <section class="grid">
          <article class="card"><div class="label">Running on</div><div class="value">{{ .Values.cluster.name }}</div></article>
          <article class="card"><div class="label">Region</div><div class="value">{{ .Values.cluster.region }}</div></article>
          <article class="card"><div class="label">Environment</div><div class="value">{{ .Values.cluster.environment }}</div></article>
          <article class="card"><div class="label">Application</div><div class="value">v{{ .Values.application.version }}</div></article>
        </section>
        <footer>
          <span>One chart • Placement-driven destinations • Automated prune and self-heal</span>
          <span id="clock"></span>
        </footer>
      </main>
      <script>
        const clock = document.getElementById('clock');
        const update = () => clock.textContent = new Date().toLocaleString();
        update(); setInterval(update, 1000);
      </script>
    </body>
    </html>
