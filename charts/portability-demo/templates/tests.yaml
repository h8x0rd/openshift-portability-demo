apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "portability-demo.fullname" . }}-test"
  labels:
    {{- include "portability-demo.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: curl
      image: curlimages/curl:8.12.1
      command:
        - sh
        - -c
        - curl --fail --silent --show-error http://{{ include "portability-demo.fullname" . }}:{{ .Values.service.port }}/
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
