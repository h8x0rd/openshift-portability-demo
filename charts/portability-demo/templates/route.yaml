{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: portability-demo
  labels:
    {{- include "portability-demo.labels" . | nindent 4 }}
spec:
  to:
    kind: Service
    name: portability-demo
  port:
    targetPort: http
  tls:
    termination: {{ .Values.route.tls.termination }}
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
