{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "portability-demo.fullname" . }}
  labels:
    {{- include "portability-demo.labels" . | nindent 4 }}
spec:
  to:
    kind: Service
    name: {{ include "portability-demo.fullname" . }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: {{ .Values.route.tls.termination }}
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
